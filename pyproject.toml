[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "labnode"
version = "0.1.0"
description = "Wrap a lab instrument in a small REST API: write run(), get /status, /start, /stop and /taken."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
test = ["httpx"]

[tool.setuptools.packages.find]
where = ["src"]
